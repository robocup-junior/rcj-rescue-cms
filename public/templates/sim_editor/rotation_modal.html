<div class="modal-header sim-modal-header">
  <h3 class="modal-title"><i class="fas fa-sync-alt"></i>{{"admin.simMapEditor.victimRotation" | translate}} - {{label}}</h3>
</div>
<div class="modal-body sim-modal-body">
  <sim-rotation-dial ng-model="value.angle" symbol="symbol" image="image"></sim-rotation-dial>
</div>
<div class="modal-footer sim-modal-footer">
  <button class="btn btn-outline-secondary" type="button" ng-click="cancel()">{{"common.cancel" | translate}}</button>
  <button class="btn btn-primary" type="button" ng-click="ok()"><i class="fas fa-check mr-1"></i>OK</button>
</div>
