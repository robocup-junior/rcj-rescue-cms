<div class="modal-header sim-modal-header">
  <h3 class="modal-title"><i class="fas fa-paint-brush"></i>Custom Room 4 Creator</h3>
</div>
<div class="modal-body sim-modal-body">
  <div class="sim-room4-creator">
    <div id="test"></div>
    <canvas id="room4Canvas" drawing></canvas>

    <div class="sim-room4-panel">
      <label><input type="checkbox" id="drawWall" checked />Draw Walls (Black)</label>
      <label><input type="checkbox" id="drawVic" />Draw Victims (Red)</label>
      <label><input type="checkbox" id="erase" />Erase</label>
      <button class="btn btn-sm btn-outline-secondary rounded-pill" type="button" ng-click="clearCanvas()">
        <i class="fas fa-eraser mr-1"></i>Clear Canvas
      </button>
    </div>

    <div class="sim-room4-panel">
      <label for="importCanvas">Import Room 4 Picture to Canvas:</label>
      <input type="file" id="importCanvas" accept="image/png, image/jpeg" onclick="this.value=null;" />
    </div>

    <div class="sim-room4-panel">
      <button class="btn btn-sm btn-outline-primary rounded-pill" type="button" ng-click="downloadCanvas()">
        <i class="fas fa-download mr-1"></i>Download Custom Room 4
      </button>
    </div>
  </div>
</div>
<div class="modal-footer sim-modal-footer">
  <button class="btn btn-primary" type="button" ng-click="closeRoom4()">OK</button>
</div>
