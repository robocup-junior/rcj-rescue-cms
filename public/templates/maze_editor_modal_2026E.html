<div class="modal-header" style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;">
  <h3 class="modal-title" style="font-weight: 600; color: #495057;"><i class="fas fa-cube" style="margin-right: 8px;"></i>{{"admin.mazeMapEditor.item" | translate}}</h3>
</div>
<div class="modal-body" style="padding: 20px;">
  <div style="margin-bottom: 25px;">
    <h5 style="font-weight: 600; color: #495057; margin-bottom: 15px; border-left: 4px solid #007bff; padding-left: 10px;">{{"admin.mazeMapEditor.tileProperties" | translate}}</h5>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
      <label class="btn" ng-class="cell.tile.checkpoint ? 'btn-success' : 'btn-outline-secondary'" ng-style="cell.tile.black ? {'opacity': '0.5', 'cursor': 'not-allowed'} : {'cursor': 'pointer'}" style="margin: 0; padding: 10px 16px; font-size: 1.05em;">
        <input type="checkbox" ng-model="cell.tile.checkpoint" ng-change="propertyChanged()" ng-disabled="cell.tile.black" style="display: none;"><img src="/images/checkpoint.png" height="24" style="margin-right: 8px; vertical-align: middle;">{{"admin.mazeMapEditor.cp" | translate}}
      </label>
      <label class="btn" ng-class="cell.tile.black ? 'btn-dark' : 'btn-outline-secondary'" ng-style="hasVictims() || cell.tile.checkpoint ? {'opacity': '0.5', 'cursor': 'not-allowed'} : {'cursor': 'pointer'}" style="margin: 0; padding: 10px 16px; font-size: 1.05em;">
        <input type="checkbox" ng-model="cell.tile.black" ng-change="blackChanged()" ng-disabled="hasVictims() || cell.tile.checkpoint" style="display: none;"><i class="fas fa-square" style="margin-right: 8px; font-size: 20px;"></i>{{"admin.mazeMapEditor.black" | translate}}
      </label>
      <label class="btn" ng-class="cell.tile.speedbump ? 'btn-warning' : 'btn-outline-secondary'" style="cursor: pointer; margin: 0; padding: 10px 16px; font-size: 1.05em;">
        <input type="checkbox" ng-model="cell.tile.speedbump" ng-change="propertyChanged()" style="display: none;"><img src="/images/speedbump.png" height="22" style="margin-right: 8px; vertical-align: middle;">{{"admin.mazeMapEditor.bump" | translate}}
      </label>

      <label class="btn" ng-class="isStart ? 'btn-success' : 'btn-outline-success'" ng-disabled="isStart" style="cursor: pointer; margin: 0; padding: 10px 16px; font-size: 1.05em;">
        <input type="checkbox" ng-model="isStart" ng-disabled="isStart" ng-change="startChanged()" style="display: none;"><i class="fas fa-play" style="margin-right: 8px; font-size: 20px;"></i>{{"admin.mazeMapEditor.start" | translate}}
      </label>
    </div>
  </div>

  <div style="margin-top: 25px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
      <h5 style="font-weight: 600; color: #495057; margin: 0; border-left: 4px solid #28a745; padding-left: 10px;">{{"admin.mazeMapEditor.placement" | translate}}</h5>
      <div ng-if="isVictimDisabled()" style="background-color: #fff3cd; color: #856404; padding: 8px 15px; border-radius: 6px; font-size: 0.9em; border: 1px solid #ffeeba;">
        <i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>{{"admin.mazeMapEditor.victimRestricted" | translate}}
      </div>
    </div>
    <table class="table table-bordered" style="margin-bottom: 0; font-size: 1.1em;" ng-style="isVictimDisabled() ? {'opacity': '0.6'} : {}">
      <thead style="background-color: #f8f9fa;">
        <tr>
          <th style="width: 25%; text-align: center; vertical-align: middle; padding: 12px;">&nbsp;</th>
          <th style="width: 25%; text-align: center; vertical-align: middle; padding: 12px;"><img src="/images/no_victims.png" alt="None" height="30"></th>
          <th style="width: 25%; text-align: center; vertical-align: middle; padding: 12px;"><img src="/images/Red.png" alt="Red" height="30"></th>
          <th style="width: 25%; text-align: center; vertical-align: middle; padding: 12px;"><img src="/images/Green.png" alt="Green" height="30"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th style="text-align: center; vertical-align: middle; background-color: #f8f9fa; padding: 14px;">{{"admin.mazeMapEditor.floor" | translate}}</th>
          <td style="text-align: center; vertical-align: middle; padding: 14px;"><input type="radio" ng-model="cell.tile.victims.floor" value="None" style="display: block; margin: 0 auto; transform: scale(1.4);"></td>
          <td style="text-align: center; vertical-align: middle; padding: 14px;"><input type="radio" ng-model="cell.tile.victims.floor" value="Red" ng-disabled="isVictimDisabled()" style="display: block; margin: 0 auto; transform: scale(1.4);"></td>
          <td style="text-align: center; vertical-align: middle; padding: 14px;"><input type="radio" ng-model="cell.tile.victims.floor" value="Green" ng-disabled="isVictimDisabled()" style="display: block; margin: 0 auto; transform: scale(1.4);"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal-footer" style="background-color: #f8f9fa; border-top: 2px solid #dee2e6;">
  <button class="btn btn-primary btn-lg" type="button" ng-click="ok()" style="min-width: 100px;"><i class="fas fa-check" style="margin-right: 5px;"></i>OK</button>
</div>
