name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]
  schedule:
    - cron: '0 15 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning
      security-events: write
      # Read the workflow run status (needed in private repositories)
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # JavaScript is analysed straight from the source; nothing has to be built
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # doc/ is the API documentation apidoc made, with its vendored libraries: not of the app.
          # Every request is rate limited, by the limiter app.js uses before all the routes; CodeQL
          # does not follow the routers through access.mount() (helper/access.js) to see it.
          config: |
            paths-ignore:
              - doc
            query-filters:
              - exclude:
                  id: js/missing-rate-limiting

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
